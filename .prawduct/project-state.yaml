# =============================================================================
# DERIVED VIEWS (enabled by default, v1.4+)
# =============================================================================
# When true (default), three derived views are regenerated from
# change-log.md tagged entries (see that file for the tag format):
#   * build-plan `## Status` block (checkboxes from `status=shipped` tags)
#   * `.prawduct/release-notes.md` (from `release=` tags)
#   * `scope_rollups:` block above (from `scope=` tags)
# Run `python3 tools/product-hook regen-views` to apply. Set to `false`
# to opt out.

views_enabled: true

# Test roots for the evidence recorder, which otherwise discovers repo-root
# `tests/` only. This repo is a two-package layout: the engine's suite is under
# `tests/`, the MCP server's under `hallucinote_mcp/tests/`, and `examples/`
# carries the demo song's own assertions — the same three roots as pyproject's
# `testpaths`, and they must stay in step with it. Without this the recorded
# `tests_executed` lists engine tests only, so an MCP-side test reads as
# unevidenced even though the counted run included it.
tests_dirs: tests hallucinote_mcp/tests examples

# Backlog format: 2 = structured (id + metadata bar + body, three canonical
# sections). Set by `/backlog migrate` 2026-05-29. Resolves the
# `legacy-backlog-format` post-sync advisory.
backlog_format_version: 2

# Stamped by /prawduct:backlog list/pick/triage — resolves the backlog-overdue-grooming advisory.
backlog_last_groomed_at: 2026-07-04

# THE LIVE BACKLOG. Set at the MG4 migration-scrub cutover 2026-08-10, after
# `verify-migration` exited 0 with all five lists empty (225 source items, 225
# aliased). From this point `.prawduct/backlog.md` is FROZEN HISTORY and is no
# longer read: the backlog lives in this repo's GitHub Issues, reached through
# `prawduct-hook backlog <op> --repo …`. Decisions + audit record:
# `.prawduct/artifacts/migration-scrub-decisions.md`.
#
# Unsetting this key restores markdown as live, but that is only one of three
# halves — the migrated issues must also be closed (filter on the `id:` alias
# namespace; never delete, GitHub does not reuse numbers) and backlog.md's
# frozen-history banner reverted. Skip the third and the restored backlog
# announces that it is frozen and redirects to a tracker that is closed.
backlog_service_repo: brookstalley/hallucinote

# Distribution mode — set by /prawduct:migrate (v2.0.0 plugin cutover).
# `plugin` tells the legacy file-sync hook to stand down (Chunk 8).
distribution: plugin

# Integration base — this repo is gitflow-on-develop: feature/fix branches PR into
# `develop`; releases cut to `main`. Set so `resolve-base` and the Critic/PR gates
# scope `merge-base...HEAD` against develop, not the default origin/main. (INS-7V2D
# Critic NOTE 2026-06-04.)
base_branch: develop

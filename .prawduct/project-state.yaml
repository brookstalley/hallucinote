# Project State — Hallucinote
#
# Single source of truth for all project decisions.
# Read at session start to understand where things stand.
#
# Fields start as null and are filled during discovery.
# Partially-populated state is normal throughout discovery.
#
# Backfilled in J-5 (2026-05-17) from existing artifacts (VISION.md,
# mcp-tool-design.md, project-preferences.md, boundary-patterns.md,
# build-plan history). Project predated framework discovery, so this is
# `source: inferred` rather than `discovery`. Surface gaps in
# `open_questions` for user ratification.

# =============================================================================
# CLASSIFICATION
# =============================================================================
# Populated during discovery. Confirmed with the user before planning.

classification:
  # Product domain. Values: utility, social, marketplace, productivity, b2b,
  # content, automation, developer-tool, education, health, finance,
  # entertainment, communication. May be multiple for hybrid products.
  domain: [developer-tool, entertainment]

  # Structural characteristics — architectural facts that determine what KINDS
  # of artifacts a product needs. These are a small, stable set (6) that drive
  # artifact generation. null = not applicable.
  structural:
    # User-facing interface. modality: screen|terminal|voice|spatial|minimal; platform: mobile|web|desktop|cross-platform
    has_human_interface:
      modality: terminal
      platform: desktop
    # Runs without user interaction. trigger: scheduled|event-driven|always-on
    runs_unattended: null
    # Exposes or consumes APIs. consumers: internal|external|both
    exposes_programmatic_interface:
      consumers: internal
    # Multiple distinct user types. parties: [list of distinct user types]
    has_multiple_party_types: null
    # Handles sensitive information. categories: [PII, financial, health, etc.]; regulatory: [list]
    handles_sensitive_data: null
    # Multiple processes or services communicating at runtime. topology: monolith-with-workers|client-server|microservices|pipeline
    multi_process_distributed:
      topology: client-server

  # Domain-specific characteristics — what makes THIS product unique in its domain.
  # Dynamically identified, not from a predefined list.
  # Each: { characteristic: string, implications: [string] }
  domain_characteristics:
    - characteristic: "LLM-native composition (structure-first, not pixels)"
      implications:
        - "Every surface MCP-reachable; semantic tags ride alongside data; diffs describe musical intent"
    - characteristic: "DB-as-source-of-truth with append-only event log"
      implications:
        - "Mutator-only writes; state change + event row in one transaction; event-store flip seeded"
    - characteristic: "Bidirectional sync with Ableton Live"
      implications:
        - "Push via plan_push_* + apply_push_results; pull via PullPlan (Ableton-authoritative under V1); bindings in ableton_sessions + ableton_links, separate from core rows"
    - characteristic: "Songs as git repos (forkable, diffable, reproducible)"
      implications:
        - "A song = songs/<slug>/ with build.py + captured_session.json + tests/ + per-song SQLite DB (gitignored); cross-song reuse via shared kit/groove/template tables"

  # Risk and complexity profile.
  risk_profile:
    # Overall risk: low, medium, high.
    # Drives discovery depth (low: 5-8 questions, medium: 8-15, high: 15-25).
    overall: low
    # Specific risk factors identified during classification.
    # Each: { factor, level (low/medium/high), rationale }
    factors:
      - factor: "Single-user, local-only deployment"
        level: low
        rationale: "No production service, no multi-tenant concerns, no PII"
      - factor: "Schema migrations as the suite grows"
        level: medium
        rationale: "DB is the contract — drift here is expensive. Mutator+event discipline keeps an event-store flip cheap; ad-hoc schema edits could lock it out"
      - factor: "MCP-layer dependency on Ableton's embedded Python + Remote Script ABI"
        level: medium
        rationale: "Live's Remote Script API is undocumented and version-sensitive; gap-#4 (note-level addressing) and a handful of envelope reads remain Live-API-blocked"
      - factor: "LLM-as-composer effectiveness is an unproven bet"
        level: medium
        rationale: "VISION.md names structure-unlocks-competence as load-bearing; product success depends on it being true at depth"

  # Prior art surfaced during discovery (via web search or domain knowledge).
  # Informational — informs scope decisions, not a gate.
  # Each: { name, url (optional), relevance, relationship (alternative|complement|reference) }
  prior_art:
    - name: "AbletonMCP / ableton-mcp-extended"
      url: "https://github.com/uisato/ableton-mcp-extended"
      relevance: "Original 52-tool MCP surface hallucinote-mcp greenfields away from (Wave M)"
      relationship: reference
    - name: "A sibling MCP project (Claude ↔ Grasshopper)"
      relevance: "Action-dispatch + discovery-layered tool design; docs/archive/mcp-tool-design.md §2"
      relationship: reference
    - name: "MCP tool-count research (Anthropic, Speakeasy, Copilot)"
      relevance: "Effectiveness degrades past ~25 tools; drove the 52→10 consolidation (docs/archive/mcp-tool-design.md §1.2)"
      relationship: reference

# =============================================================================
# PRODUCT DEFINITION
# =============================================================================
# Populated during discovery and definition.

product_definition:
  # One-sentence description of what this product is and why it exists.
  vision: "LLM-native music composition and production environment where the DB is the source of truth and Ableton Live is the rendering engine."

  # Measurable success criteria. What does "this worked" look like?
  goals:
    - "Move composers up the ladder of abstraction: an LLM builds a musical idea end-to-end against the DB"
    - "Songs are forkable: branch a chorus variant, A/B it, throw it away — diffable and reviewable like code"
    - "Bulk operations become one-liners (humanize backbeats, sidechain pad notes) without a scripting career"
    - "Songs are testable: structural assertions (bass-kick alignment, master-limiter presence) ride with the song"

  # Who uses this product and what they need.
  users:
    # Each persona:
    #   name: string
    #   description: string
    #   technical_level: none | basic | intermediate | advanced
    #   primary_needs: [string]
    #   constraints: [string]
    personas:
      - name: "LLM-collaborating composer"
        description: "The human author working through an LLM agent (Claude Code); the LLM mediates the structured access."
        technical_level: intermediate
        primary_needs:
          - "Structured access to every musical surface; lossless bidirectional Ableton sync; bulk ops as one-liners"
        constraints:
          - "Single-user authoring; local deployment, no cloud dependency"
      - name: "The LLM agent itself"
        description: "Claude Code (or equivalent MCP-capable agent) is a first-class consumer; the tool surface is designed for its context-cost economics."
        technical_level: advanced
        primary_needs:
          - "Low-context-cost surface (~10 unified tools); self-service discovery (resources + prompts); error responses that teach"
        constraints:
          - "Tool-count research caps effective surface around 25; 52 collapsed empirically"

  # Core user flows (UI), operations (API), or pipeline stages (automation).
  # Each: { name, description, steps (optional), priority (must-have/nice-to-have) }
  core_flows:
    - name: "Compose via generators → mutators → DB"
      description: "Pure generators produce note arrays with semantic tags; song build.py persists them via mutators; events emit alongside."
      priority: must-have
    - name: "Push DB → Ableton"
      description: "plan_push_* emits a PushPlan of canonical MCP calls; apply_push_results writes the projection."
      priority: must-have
    - name: "Pull Ableton → DB"
      description: "PullPlan probes the live surface; apply_pull_results diffs and mutates (Ableton-authoritative under V1)."
      priority: must-have
    - name: "Capture initial snapshot"
      description: "hallucinote.capture one-shot snapshot seeds the DB's mix half on song creation."
      priority: must-have
    - name: "Build the example song"
      description: "`python songs/falling-walking/build.py --reset` is the end-to-end smoke + canary."
      priority: must-have

  # Scope decisions.
  scope:
    v1:
      # `scope.v1` is the intent for the v1.0 release surface — it lists
      # what's IN scope, regardless of shipped status. For current ship
      # status see `git log` + `.prawduct/.test-evidence.json` + the
      # build-plan in `.prawduct/artifacts/build-plan.md`.
      - "DB schema + mutator API + queries (TEXT UUID identity; paired state-change + event-emit)"
      - "Push planners: clip, score, mix, devices, automation, arrangement, cue points"
      - "Pull planners: mix-state, cue points + score globals, device chains, arrangement-clip placements, session-view clip slots (added at V1 close-out 2026-05-17)"
      - "Note pull via stable-ID read (`get_notes_extended`) + whole-clip write (`replace_notes`); per-note diff DB-side (gap #4 partial resolution, V1 close-out scoping 2026-05-17). Mid-playback retrigger caveat acceptable — live performance is in `scope.never`."
      - "hallucinote-mcp v1.0: 10 unified action-dispatch tools + resources + prompts + install skill; no separate `ableton_help` tool (V1 close-out decision 2026-05-17)."
      - "falling-walking as the canary song — its build + snapshot tests gate every push planner / mutator change (see `.prawduct/.test-evidence.json` for current suite count)"
    accommodate:
      - "Multi-song workspace: cross-song shared kits, groove templates, instrument presets (project memory: cross-song reuse)"
      - "Event-store flip: schema and mutator discipline already seed it"
      - "App-layer multi-user concurrency: solves at the DB / event-store layer, never the MCP wire shape (memory: feedback_app_layer_concurrency)"
    later:
      - "Envelope pull (blocked on `hallucinote-mcp` envelope read surface — backlog)"
      - "Nested rack chain probe + push (blocked on `hallucinote-mcp` `get_device_chains` — backlog)"
      - "Tempo / signature automation at (bar, beat) (blocked on Live arrangement-envelope target_kind — backlog)"
      - "Device-parameter pull (sync-layer not yet built — backlog. `ableton_device(action='get_parameters')` is fine in the greenfield server; the legacy fork's #17b bug doesn't apply)"
      - "Performance / expression realization layer — authored PROFILE -> structured 1/f realization reading energy/harmony (KTH metaperformer pattern); metered-only by design. See arrangement-model.md 'The dimension taxonomy' + backlog ARR-8P5K / ARR-2B6K."
      - "Melody line layer — genre-general substrate + declared per-song PROFILE, lens grading against its OWN intent (never a universal 'good melody' stamp). Read-side lens SHIPPED (src/hallucinote/melody/); next = profile authoring + grading + learn-back. See melody-model.md, arrangement-model.md Melody subsection + backlog MEL-1A7K."
      - "Audio render + analysis (ableton_render + ableton_analysis)"
      - "Event replay function (replay(events) → state) + cross-DB merge tooling — useful after event-store flip"
      - "Track routing: sidechain, parallel busses, input/output routing config"
      - "Group tracks (tracks.parent_track_id + Live group semantics)"
      - "Audio clips: clip kind discriminator, file references, warp metadata"
    never:
      - item: "A general DAW competing with Ableton"
        rationale: "Ableton is the rendering engine; Hallucinote leans on it, doesn't replace it"
      - item: "A non-LLM authoring tool"
        rationale: "Every design choice favors the LLM workflow; humans can write Python against the library but they're not the target"
      - item: "A live performance system"
        rationale: "Composition + production tool only; performance happens downstream in Ableton"
      - item: "A walled garden / proprietary formats"
        rationale: "SQLite + Python + git + standard MCP. If Hallucinote dies, songs are still composable from the repo"

  # Product identity.
  product_identity:
    name: "Hallucinote"
    personality: null     # Brand personality, mood (null for internal tools)
    visual_preferences: null  # Look/feel preferences (null for non-visual products)

  platform: "CLI + local MCP server (Python; SQLite; Ableton Live Remote Script on macOS today)"

  # Non-functional requirements, calibrated to risk.
  nonfunctional:
    performance: "Test suite under ~10s serial (counts + timings: `.prawduct/.test-evidence.json`). Push/pull latency bounded by MCP round-trips, not planner cost."
    scalability: "Not applicable — single-user authoring. Songs are independent; no shared-state concerns."
    uptime: "Not applicable — no always-on component."
    cost_constraints: "Zero monthly cost target — local-only deployment, no cloud services, no paid APIs."

  regulatory: []          # Each: { regulation, applicability, impact }
  cost_estimates: []      # Each: { item, estimated_monthly_cost, notes }

# =============================================================================
# TECHNICAL DECISIONS
# =============================================================================
# Every entry includes rationale.
# Each: { decision, rationale, alternatives_considered, date }

technical_decisions:
  architecture:
    - decision: "DB-as-source-of-truth with append-only event log; mutator-only writes"
      rationale: "Every state change pairs with an event row in the same transaction. The event log seeds a future event-store flip without requiring a rewrite — the schema is the *materialized state* of a stream we'll replay later (project memory: architecture_db)."
      alternatives_considered: "DAW-project-as-source-of-truth (the AbletonMCP fork's implicit model); pure event store from day one (premature for current single-user scale)."
      date: "2026-05-15 (chunks 1-5 migration)"
    - decision: "Plan-based sync (not side-effect sync)"
      rationale: "sync.push returns PushPlan / ToolCall objects; the agent executes the plan and feeds results back via apply_push_results. Keeps the sync layer testable without Live running and reorder-safe across MCP retries."
      alternatives_considered: "Direct MCP invocation from sync — would couple tests to a live MCP server; rejected as a long-term posture."
      date: "2026-05-15 (chunks 1-5)"
    - decision: "10 unified MCP tools with action dispatch (greenfield as `hallucinote-mcp`)"
      rationale: "Tool-count research caps effective LLM tool selection around 25; AbletonMCP's 52-tool surface measurably degraded the model. Consolidating into ableton_session/track/return/clip/note/device/automation/arrangement/scene/browser keeps capability while cutting the selection space."
      alternatives_considered: "Continue extending AbletonMCP narrow-setter-by-narrow-setter; rejected because each new capability would add to the 52-tool problem rather than solving it."
      date: "2026-05-16 (Wave M design merged; v1.0 surface closed at M-7)"
    - decision: "Bidirectional sync with Ableton-authoritative conflict policy (V1)"
      rationale: "PullPlan + apply_pull_results path is Ableton-authoritative under the V1 conflict policy; field-level diffs tolerate _FLOAT_EPS jitter so display rounding doesn't churn events. Three-way merge deferred until cross-collaborator merges become real."
      alternatives_considered: "DB-authoritative (rejected — punishes manual edits in Ableton); three-way merge (deferred — premature without multi-collaborator workflows)."
      date: "2026-05-16 (Wave 3 pull-side sync)"
    - decision: "W11-A `hallucinote://` resources: shared `hallucinote-core` package, slug-in-URI addressing, LOM-mirrored hierarchy, always-requery (no caching)"
      rationale: "Four interlocking choices: (a) shared core read-API package both `hallucinote` and `hallucinote-mcp` depend on (deliberate public-contract boundary); (b) song slug explicit in every URI (cwd-based resolution unreliable across multi-song sessions); (c) URI shape mirrors the `ableton://` hierarchy (one mental model); (d) handlers re-read SQLite per request (caching invalidated by concurrent mutation). Full rationale in this file's git history (pre-2026-07-04) and docs/archive/mcp-tool-design.md."
      alternatives_considered: "Direct import of hallucinote (tight coupling), parallel reader (drift), cwd-based song resolution, per-resource caching — all rejected."
      date: "2026-05-20 (W11-A scoping, post-v1 cumulative merge to main)"

  technology:
    - decision: "Python 3.10+ runtime for the hallucinote library; stdlib-only EXCEPT the audio-analysis foundation (numpy/scipy/soundfile/pyloudnorm/librosa/pyroomacoustics)"
      rationale: "Originally stdlib-only for a durable dependency surface. Superseded in part by #99/#100: six audio deps (see pyproject.toml) adopted as first-class platform capability — FFT/true-peak/BS.1770-4/RT60 can't be done in stdlib. All MIT/BSD/ISC. The hallucinote-mcp server stays stdlib-only at startup (separate decision below)."
      alternatives_considered: "Rust core (premature); audio deps behind an [audio] extras group (rejected — analysis is platform, not optional; see change-log.md)."
      date: "2026-05-15; audio-dep adoption noted 2026-06-04 (AUD-9D3P)"
    - decision: "`mcp>=1.0` for the hallucinote-mcp server"
      rationale: "Standard MCP transport; hallucinote_mcp/pyproject.toml declares it as the only runtime dep."
      alternatives_considered: "Custom JSON-RPC — would diverge from the agent ecosystem."
      date: "2026-05-16"
    - decision: "SQLite WAL with `timeout=10.0`"
      rationale: "Single-user, local. WAL gives readers + writers without blocking; the 10s timeout absorbs any short contention from concurrent build/test runs."
      alternatives_considered: "Postgres (overkill for single-user); DuckDB (analytical-first, weaker write story)."
      date: "2026-05-15"
    - decision: "pytest + hypothesis (enabled Wave M-4) for tests; pytest-xdist for parallelism"
      rationale: "pytest is the de facto standard. Hypothesis `dev`/`ci` profiles registered in tests/conftest.py; xdist uses directory-grouped distribution to preserve fixture isolation."
      alternatives_considered: "unittest (too verbose for fixture-heavy code)."
      date: "2026-05-15 (pytest), Wave M-4 (hypothesis enabled), J-2 (xdist installed)"

  data_model:
    - decision: "TEXT UUID primary keys (generated via `uuid.uuid4().hex`)"
      rationale: "Aligns with future cross-DB merge stories — UUIDs don't collide across forks. Generated in Python (`_uuid()` helper) so mutators don't depend on DB autoincrement."
      alternatives_considered: "INTEGER PRIMARY KEY (rejected — would collide across cross-collaborator merges)."
      date: "2026-05-15 (chunk 1)"
    - decision: "Paired state-change + event-emit in the same transaction"
      rationale: "Every mutator calls `_emit` exactly once in the same DB transaction as its state write. The event row carries `actor`, `reason`, `request_id`, `seq` (monotonic). This is the load-bearing invariant for a future event-store flip."
      alternatives_considered: "Logging-style events outside the transaction (rejected — opens drift between state and audit log)."
      date: "2026-05-15"
    - decision: "Audio clips share the `clips` table via a `kind` discriminator (CLP-AUD1 wave 1)"
      rationale: "Audio material is a clip row with kind='audio' + locked wave-1 audio columns; invariants live in mutators (not schema CHECKs); path resolution is caller-owned via stdlib-only `hallucinote.paths.resolve_audio_path`. Full column semantics + sync exemptions in .prawduct/artifacts/plans/CLP-AUD1/archive/design.md."
      alternatives_considered: "Separate audio_clips table (duplicates every clip constraint); warp_mode as TEXT enum (drifts from LOM int domain); absolute-only paths (breaks portability)."
      date: "2026-06-10 (CLP-AUD1 chunks 1-2; design at .prawduct/artifacts/plans/CLP-AUD1/archive/design.md)"
    - decision: "ableton_sessions + ableton_links projection separation"
      rationale: "Bindings to Ableton don't live on core rows. Multiple sessions per song are intentional — one song can be bound to several Live sets without aliasing. `link_db_to_ableton(session_id, db_kind, db_id, ableton_index)` is the generic mutator that replaced three per-domain link_*_to_ableton functions."
      alternatives_considered: "Per-domain ableton_index columns on every entity row (rejected — coupled core schema to the rendering layer)."
      date: "2026-05-15 (chunk 1)"

  integrations:
    - decision: "Greenfield `hallucinote-mcp` v1.0 as the MCP layer (in-repo, replacing AbletonMCP fork)"
      rationale: "The AbletonMCP / ableton-mcp-extended fork drove the original design but its 52-tool surface hit the model-effectiveness ceiling. Wave M migrated to a greenfield 10-tool surface with action dispatch + resources + prompts; the fork is no longer a runtime dependency."
      alternatives_considered: "Continue patching the fork; rejected for the same reason the consolidation happened."
      date: "2026-05-16 (Wave M close)"
    - decision: "Ableton Remote Script for in-Live integration"
      rationale: "Live's embedded Python is the only path to live session control. The Remote Script runs inside Live, the hallucinote-mcp server runs outside, UDP carries the wire protocol."
      alternatives_considered: "Max for Live (heavier; not all users have it); OSC-only (lower-level than needed)."
      date: "2026-05-16"

  operational:
    - decision: "Install resolves the running server's identity by asking the server (ableton://server/info), not by reconstructing the plugin root from env/disk (INS-3W8P)"
      rationale: "Vendor + fingerprint must target the copy the plugin LAUNCHES; coexistence setups diverge silently otherwise. CLAUDE_PLUGIN_ROOT isn't in the skill's bash env and --plugin-dir roots are undiscoverable, so the running server self-reports {version, package_root} via a static resource. Contract in boundary-patterns.md; topology in docs/dev-vs-use-coexistence.md."
      alternatives_considered: "Env-var pinning (var absent); disk discovery (fragile, can't find --plugin-dir roots). Runtime handshake remains the safety net under all options."
      date: "2026-06-13 (INS-3W8P)"
    - decision: "Self-contained plugin: the engine ships INSIDE the plugin's uv env; skills run it via the server's own interpreter; no PyPI, no separate clone (PLUGIN-SELF-CONTAINED)"
      rationale: "No PyPI publish (private project), so the repo is a uv workspace and `uv sync --all-packages` builds ONE env holding server + engine (editable). Skills invoke `\"$PY\" -m hallucinote.cli <cmd>` where $PY is the running server's interpreter (ableton://server/info) — same env as the bridge, no default-venv divergence (Critic-W2 fix). Server stays stdlib-only at startup, lazy-imports the engine on analysis calls. Full narrative in this file's git history (pre-2026-07-04) and docs/dev-vs-use-coexistence.md."
      alternatives_considered: "PyPI publish (nothing to publish to); `uv run --project` (different env, fails on read-only plugin root); separate engine clone (defeats one-command install)."
      date: "2026-06-16 (PLUGIN-SELF-CONTAINED; supersedes INS-7V2D's PyPI-out assumption)"
    - decision: "Go public WITHOUT rewriting git history; the privacy scrub is tip-only and that is accepted (PRC-6N2X)"
      rationale: "The PUB-READY scrub cleaned the tracked tree, not the commits behind it: as of daa9ba6 (develop @ v1.7.1, the last commit before this branch), 17 commits carry absolute home-directory paths and 4 name a private sibling project, one of them holding that project's local source path plus a file inventory. Publishing the repo publishes those commits. Owner accepted the exposure on 2026-08-06: no credentials are involved, the private project's repo URL was already redacted before any of it was written, and stable SHAs are worth more than the residue is worth removing. Recorded here so `we scrubbed it` is never later misread as `it is not in the repo` — the distinction is tree vs history, and only the tree was cleaned. NOTE the count is anchored to a SHA on purpose: `git log <rev> -S'/Users/' --oneline | wc -l` SELF-COUNTS, because the scrub commits and this record are themselves commits containing the string. It reads 17 at daa9ba6, 19 after the scrub, 21 after this entry — re-running it today and comparing against a bare number would look like a regression that never happened. Do not `fix` this by adding a `':!.prawduct/'` pathspec; that returns a different, smaller number and silently measures something else."
      alternatives_considered: "git-filter-repo over all refs before publishing — rejected: it invalidates every open branch and PR, and the residue does not justify that. The window was genuinely cheap only until the first external clone or fork, so this decision is effectively one-way once the repo is public."
      date: "2026-08-06 (PRC-6N2X; from the independent PR review of chore/public-readiness)"
    - decision: "The backlog of record is GitHub Issues on brookstalley/hallucinote; .prawduct/backlog.md is frozen history (backlog_service_repo cutover)"
      rationale: "Forced by the plugin: while a structured markdown backlog existed with backlog_service_repo unset, every session raised the backlog-service-migration-required advisory, and a future upgrade retires the shared markdown read path — so the choice was migrate deliberately or be degraded to a zeroed backlog count later. Archive scope was `all` (225 items, not just the 111 live) on a MEASURED basis: 70 of 111 live items (63%) cite at least one archived id, spanning 60 distinct archived items, and under `open` those citations would dangle because no adapter op reads the skipped set. Recorded only after `verify-migration --archive-scope all` exited 0 with all five lists empty (225 source items, 225 aliased) — the gate is what makes the key safe to set, since setting it is what makes the markdown stop being read. Full audit record incl. which plugin build ran it: .prawduct/artifacts/migration-scrub-decisions.md. PUBLISH EXPOSURE: this puts 225 issues carrying candid internal material (owner rulings, Critic findings, dogfood reports) in the repo's Issues — private today, public the moment the repo is, which is the same tree-vs-history exposure question PRC-6N2X answered for commits. Accepted 2026-08-10 on the same basis: no credentials are involved. ROLLBACK IS NOT FREE and takes all three halves — unset the key, close the migrated issues (filter on the `id:` alias namespace; never delete, GitHub does not reuse numbers), and revert backlog.md's frozen-history banner. Skip the third and the restored live backlog announces that it is frozen and redirects to a tracker you just closed. It also silently discards every post-cutover tracker edit and returns the six disposed items to open, because the frozen markdown still records them that way."
      alternatives_considered: "Stay on markdown — rejected: the advisory is permanent and the read path is scheduled for retirement, so this defers a forced migration into a worse one. Archive scope `open` (111 items, half the title work, ~7min not ~20) — rejected on the 63%-citation measurement above; it is also only nominally reversible, since a later `all` backfill re-syncs status on already-migrated items and would reopen anything closed since cutover. A dedicated backlog repo — rejected: cross-repo links to code for no gain while the repo is private."
      date: "2026-08-10 (migration-scrub MG4; owner-confirmed target, archive scope and dispositions)"

# =============================================================================
# DESIGN DECISIONS
# =============================================================================
# UX, IA, and design decisions. Some fields (like error_handling_approach) apply
# to all products; others (like visual_direction) only apply to products with a UI.
# Each: { decision, rationale, date }

design_decisions:
  information_architecture:
    - decision: "Layered folders inside src/hallucinote/: db/ (state+events+mutators+queries), generators/ (pure musical primitives), sync/ (DB↔Ableton bridge), capture.py (snapshot)"
      rationale: "Each layer has a clean dependency direction: generators have no DB or MCP coupling; sync produces plans, not side effects; mutators are the only sanctioned writers."
      date: "2026-05-15"
    - decision: "Songs as self-contained units under songs/<slug>/"
      rationale: "A song = build.py + captured_session.json + tests/ + per-song SQLite DB (gitignored). Tests live next to the song so the directory is forkable as a unit."
      date: "2026-05-17 (J-2b)"
  interaction_patterns:
    - name: "Propose-and-react, never interrogate"
      summary: >-
        Where a choice is the user's to own, the agent states an informed
        proposal carrying its reasoning and a recommendation, inviting a
        one-word reaction — never a blank question. A blank question is
        auto-accompaniment wearing a politeness costume: it looks collaborative
        and transfers zero expertise. Cheap-to-revise choices are made
        tastefully and *shown* (the artifact becomes the next proposal); only
        expensive-to-reverse forks earn a proposal.
      artifact: .prawduct/artifacts/intent-collaboration-model.md
    - name: "One consolidated turn, bounded"
      status: >-
        RETIRED 2026-09-01 (owner-decided) — superseded by "Build to the
        hearable unit, then offer a hearing" and "The status offer". The norm
        was right that elicitation needs a bound and wrong about which one: the
        turn cap solved correctness (no gap travels downstream dressed as a
        decision) but said nothing about ownership, and it told the agent that
        after one turn the stage closes and it may not ask again. What followed
        was a 186-tool-call build the user never authorized (CTM-10), and an
        agent declaring identity resolved while the user's answers were still
        arriving (CTM-09). The two failure modes it bounded are now bounded by
        the hearable unit (what a turn may raise) and the status offer (when to
        stop asking). Elicitation is a conversation that ends at the user's
        hand-off.
      summary: >-
        Elicitation gets exactly one turn, with every proposal, disclosure and
        piece of arithmetic in a single message. Sequential Q&A burns patience
        and violates the stop-less norm for real. An item the user leaves
        unanswered does NOT earn a second round — it becomes an UNDECIDED row
        with an owner and a closing stage, and work proceeds. Bounds two
        failure modes that both look like diligence: the stage that never
        converges, and the turn that fragments.
      artifact: .prawduct/artifacts/elicitation-and-stage-exit-criteria.md
    - name: "Read the turn before acting"
      summary: >-
        Every user turn is one of six kinds — directing, reacting, exploring,
        asking, delegating, handing-off — and only directing and handing-off
        authorize building. Musing is not a request: when the user thinks out
        loud, think with them and touch nothing. Nearly every failure in the
        evidence corpus is a misread here.
      artifact: .prawduct/artifacts/collaboration-turn-model.md
    - name: "Build to the hearable unit, then offer a hearing"
      summary: >-
        The hearable unit is the smallest thing that, once heard, tells the user
        whether the idea works. Never author past one unit without having
        OFFERED to play it — and never require the user to listen in order to
        continue: "keep going" is a complete answer, and a decline carrying a
        scope ("build it all, I'll listen at the end") is recorded and not
        re-asked. The bound is on the offer, never on the listening; insisting
        on a listen is the inquisition in another costume. Reading "done" better
        without this bound just moves the cliff — the two are one design.
      artifact: .prawduct/artifacts/collaboration-turn-model.md
    - name: "The status offer"
      summary: >-
        When you have nothing to follow and something to play: name what is
        settled so it can be corrected in a word, offer hearing as an option
        rather than a default, and name what has not come up WITHOUT asking
        about it. Naming is an invitation; asking is a demand. Fires when the
        material has reached a hearable unit AND the user's last turn closed
        rather than opened something, and no scoped decline is in force.
      artifact: .prawduct/artifacts/collaboration-turn-model.md
    - name: "A loaded prompt opens its domain"
      summary: >-
        A few words carrying many implications — a genre, a form, an era, an
        artist — are unpacked, not run with. State which implications you take
        as read so they are correctable in a word, then ask about the two or
        three whose answer would change the song most. Never the whole list,
        never a form. The reference artist is one rare instance of the general
        case, not a special case to over-index on; reading a reference as a
        shortcut that "collapses five other answers" is what produces the
        run-off-and-build failure.
      artifact: .prawduct/artifacts/collaboration-turn-model.md
    - name: "Identity closes at hand-off, never by inference"
      summary: >-
        An answer that adds a new dimension means the user has more; silence on
        something you asked is still-thinking, not agreement. The brief carries
        an owner column (yours / offer me options / mine) learned from the
        conversation rather than asked for, and is updated every turn rather
        than written once and obeyed.
      artifact: .prawduct/artifacts/collaboration-turn-model.md
    - name: "Three states, and a forbidden fourth"
      summary: >-
        Every dimension a stage touches ends DECIDED (value AND mechanism
        named), UNDECIDED (named, with an owner), or NOT-APPLICABLE (recorded
        by the agent's own judgement, never asked about). Only UNDECIDED blocks
        a stage. DESCRIBED-BUT-UNBUILT — prose naming a mechanism that does not
        exist — is not a legal state; it is the defect, and the only one with
        no symptoms. Silence about a non-applicable dimension is correct;
        silence about an undecided one is the defect.
      artifact: .prawduct/artifacts/elicitation-and-stage-exit-criteria.md
    - name: "Measurements are questions, never verdicts"
      summary: >-
        Every read-side lens (mix, melody, recurrence, masking) surfaces a
        producer's question graded against DECLARED intent — "you wanted the
        chorus to lift; does it?" — never a universal score. Revealed intent is
        learned back per-song so a confirmed choice never re-flags. Aesthetic
        judgements never fail a build.
      artifact: .prawduct/artifacts/gate-verdict-policy.md
  accessibility_approach: null
  error_handling_approach: "Plain exceptions (ValueError, KeyError); no custom hierarchy. Broad catches require a `# prawduct:allow prawduct/broad-except -- <reason>` waiver stating what is absorbed and why; every catch logs context. Narrow carve-out (ONBOARD-M4L): two leaf classes callers catch by identity — `PresetQueryNoMatchError` (device.py) and `AnalyzerNotInstalledError` (analyzer/setup.py); new code still defaults to plain exceptions."
  observability_approach: "The event log IS the audit trail. Every mutator emits an event with actor (in events.ACTORS), reason, request_id, and monotonic seq. No logging frameworks beyond stdlib `logging`. The `requests` table groups events under higher-level intent for cross-mutator correlation."
  infrastructure_dependencies: "SQLite (embedded, WAL mode) for state. Ableton Live + hallucinote-mcp Remote Script for the rendering engine. GitHub Issues on brookstalley/hallucinote is the backlog of record since the 2026-08-10 cutover — a real external service dependency, reached via the `gh` CLI (needs `repo` scope + network). It is NOT on the product's runtime path: no shipped code calls it, so a song builds, pushes and renders with GitHub unreachable; what degrades is development workflow (backlog read/write), and `prawduct-hook backlog cache-query` serves the last synced state offline. Live-Ableton tests are manual; CI runs against mocked dispatcher tests in hallucinote_mcp/tests/."
  visual_direction: null


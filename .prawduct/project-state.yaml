# =============================================================================
# HEALTH CHECK
# =============================================================================
# Tracks periodic health check state. Health checks are triggered by
# accumulating staleness signals, not by a fixed cadence.

health_check:
  last_full_check: "2026-05-17 (Janitor wave: J-1 VCS hygiene + J-2/J-2b test infra + J-3 docs refresh + J-4 backlog reshape + J-5 project-state.yaml backfill + J-6 1-based bar CHECK enforcement). Wave closed."
  last_check_findings: "VCS: clean (4 local + 2 remote branches post-J-1). Test infra: three-category test boundary restored in J-2b; pytest-xdist with directory-grouped distribution. Docs: post-Wave-M reality reflected (J-3). Backlog: pruned + reshaped (J-4). State: this file backfilled in J-5. Schema invariants: 1-based bar convention now enforced via CHECK constraints on the four score-half tables + a sync.push._split_bar runtime guard (J-6). Current suite count + timings: `.prawduct/.test-evidence.json`."

# =============================================================================
# ARTIFACT MANIFEST
# =============================================================================
# Tracks generated artifacts and their relationships.

artifact_manifest:
  # Each:
  #   name: string
  #   file_path: string (relative to project root)
  #   version: integer
  #   depends_on: [artifact names]
  artifacts:
    - name: project-preferences
      file_path: .prawduct/artifacts/project-preferences.md
      version: 3
      depends_on: []
    - name: boundary-patterns
      file_path: .prawduct/artifacts/boundary-patterns.md
      version: 3
      depends_on: [project-preferences]
    - name: build-plan
      file_path: .prawduct/artifacts/build-plan.md
      version: 1
      depends_on: [project-preferences, boundary-patterns]
    - name: arrangement-model
      file_path: .prawduct/artifacts/arrangement-model.md
      version: 2   # v2 adds the dimension taxonomy (structure intents / realization layers / subsystems) + harmony-axis resolution
      depends_on: []
    - name: performance-model
      file_path: .prawduct/artifacts/performance-model.md
      version: 2   # phase 2a SHIPPED — the symbolic performance lens (src/hallucinote/performance/) built + merged + wired into /mix-review; authoring profile (2b) + audio-extension (2c) still proposed
      depends_on: [arrangement-model]
    - name: vision
      file_path: docs/VISION.md
      version: 1
      depends_on: []
    - name: mcp-tool-design
      file_path: docs/mcp-tool-design.md
      version: 1
      depends_on: [vision]
    - name: mcp-requirements
      file_path: docs/mcp-requirements.md
      version: 2
      depends_on: [vision, mcp-tool-design]
    - name: learnings
      file_path: .prawduct/learnings.md
      version: 1
      depends_on: []
    - name: backlog
      file_path: .prawduct/backlog.md
      version: 2
      depends_on: []

# =============================================================================
# BUILD STATE
# =============================================================================
# Runtime tracking during building. Updated after each chunk.

build_state:
  source_root: "src/hallucinote/"

# =============================================================================
# CHANGE LOG
# =============================================================================
# Retired in J-3 (2026-05-17). The hallucinote_mcp/CHANGELOG.md, the per-chunk
# Status section in .prawduct/artifacts/build-plan.md, and the reflections trail
# at .prawduct/.session-reflected cover the same ground with less drift risk.

# =============================================================================
# SCOPE ROLLUPS (derived view, v1.4+)
# =============================================================================
# Auto-generated by `python3 tools/product-hook regen-views` from
# .prawduct/change-log.md `scope=` tags. Do not hand-edit — edits will be
# overwritten on next regen.

scope_rollups: {}

# =============================================================================
# DERIVED VIEWS (enabled by default, v1.4+)
# =============================================================================
# When true (default), three derived views are regenerated from
# change-log.md tagged entries (see that file for the tag format):
#   * build-plan `## Status` block (checkboxes from `status=shipped` tags)
#   * `.prawduct/release-notes.md` (from `release=` tags)
#   * `scope_rollups:` block above (from `scope=` tags)
# Run `python3 tools/product-hook regen-views` to apply. Set to `false`
# to opt out.

views_enabled: true

# Backlog format: 2 = structured (id + metadata bar + body, three canonical
# sections). Set by `/backlog migrate` 2026-05-29. Resolves the
# `legacy-backlog-format` post-sync advisory.
backlog_format_version: 2

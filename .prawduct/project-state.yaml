    note: >-
      First sweep — this is the baseline, so there is no trend yet. Of the ten norms
      measured, six held clean and four had real distance, and the four split evenly by
      cause, which is the part worth carrying forward. TWO were statement drift, where the
      code was disciplined and the norm's wording had grown wrong: "no raw SQL in callers,
      EVER" was wider than the why that justifies it, and the sync row was narrower than
      the Executor layer its own sibling artifact had already ratified. TWO were ordinary
      code drift: kit.py imported db.queries, and five modules lacked the future import
      whose row had carried an unacted-on "promote to a ruff rule" note. The lesson is not
      that statements always drift — it is that a sweep must ask which side moved, because
      the remedy is opposite. Fixing code to match a wrong statement, or amending a
      statement to excuse real drift, are both available and both wrong.

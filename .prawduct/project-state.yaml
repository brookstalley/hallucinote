# Project State — Hallucinote
#
# Single source of truth for all project decisions.
# Read at session start to understand where things stand.
#
# Fields start as null and are filled during discovery.
# Partially-populated state is normal throughout discovery.
#
# Backfilled in J-5 (2026-05-17) from existing artifacts (VISION.md,
# mcp-tool-design.md, project-preferences.md, boundary-patterns.md,
# build-plan history). Project predated framework discovery, so this is
# `source: inferred` rather than `discovery`. Surface gaps in
# `open_questions` for user ratification.

# =============================================================================
# CLASSIFICATION
# =============================================================================
# Populated during discovery. Confirmed with the user before planning.

classification:
  # Product domain. Values: utility, social, marketplace, productivity, b2b,
  # content, automation, developer-tool, education, health, finance,
  # entertainment, communication. May be multiple for hybrid products.
  domain: [developer-tool, entertainment]

  # Structural characteristics — architectural facts that determine what KINDS
  # of artifacts a product needs. These are a small, stable set (6) that drive
  # artifact generation. null = not applicable.
  structural:
    # User-facing interface. modality: screen|terminal|voice|spatial|minimal; platform: mobile|web|desktop|cross-platform
    has_human_interface:
      modality: terminal
      platform: desktop
    # Runs without user interaction. trigger: scheduled|event-driven|always-on
    runs_unattended: null
    # Exposes or consumes APIs. consumers: internal|external|both
    exposes_programmatic_interface:
      consumers: internal
    # Multiple distinct user types. parties: [list of distinct user types]
    has_multiple_party_types: null
    # Handles sensitive information. categories: [PII, financial, health, etc.]; regulatory: [list]
    handles_sensitive_data: null
    # Multiple processes or services communicating at runtime. topology: monolith-with-workers|client-server|microservices|pipeline
    multi_process_distributed:
      topology: client-server

  # Domain-specific characteristics — what makes THIS product unique in its domain.
  # Dynamically identified, not from a predefined list.
  # Each: { characteristic: string, implications: [string] }
  domain_characteristics:
    - characteristic: "LLM-native composition (structure-first, not pixels)"
      implications:
        - "Every read/write surface is reachable by an MCP-capable agent"
        - "Semantic tags (ghost/downbeat, section roles, generator provenance) ride alongside the data"
        - "Diffs describe musical intent, not byte deltas"
    - characteristic: "DB-as-source-of-truth with append-only event log"
      implications:
        - "Mutator-only writes; raw SQL in callers is a discipline violation"
        - "Every state change pairs with an event row in the same transaction"
        - "Future event-store flip is the architectural seed already planted"
    - characteristic: "Bidirectional sync with Ableton Live"
      implications:
        - "Push: plan_push_* emits canonical MCP calls; apply_push_results records the projection"
        - "Pull: PullPlan probes the surface, normalizes, mutates via the standard mutator path (Ableton-authoritative under V1 conflict policy)"
        - "Bindings live in ableton_sessions + ableton_links — projection separated from core rows"
    - characteristic: "Songs as git repos (forkable, diffable, reproducible)"
      implications:
        - "A song = `songs/<slug>/` directory with build.py + captured_session.json + tests/ + per-song SQLite DB (gitignored)"
        - "Cross-song reuse goes through shared kit/groove/template tables (memory: project_cross_song_reuse)"
        - "DB schema is the source of truth for song metadata; no sidecar config files"

  # Risk and complexity profile.
  risk_profile:
    # Overall risk: low, medium, high.
    # Drives discovery depth (low: 5-8 questions, medium: 8-15, high: 15-25).
    overall: low
    # Specific risk factors identified during classification.
    # Each: { factor, level (low/medium/high), rationale }
    factors:
      - factor: "Single-user, local-only deployment"
        level: low
        rationale: "No production service, no multi-tenant concerns, no PII"
      - factor: "Schema migrations as the suite grows"
        level: medium
        rationale: "DB is the contract — drift here is expensive. Mutator+event discipline keeps an event-store flip cheap; ad-hoc schema edits could lock it out"
      - factor: "MCP-layer dependency on Ableton's embedded Python + Remote Script ABI"
        level: medium
        rationale: "Live's Remote Script API is undocumented and version-sensitive; gap-#4 (note-level addressing) and a handful of envelope reads remain Live-API-blocked"
      - factor: "LLM-as-composer effectiveness is an unproven bet"
        level: medium
        rationale: "VISION.md names structure-unlocks-competence as load-bearing; product success depends on it being true at depth"

  # Prior art surfaced during discovery (via web search or domain knowledge).
  # Informational — informs scope decisions, not a gate.
  # Each: { name, url (optional), relevance, relationship (alternative|complement|reference) }
  prior_art:
    - name: "AbletonMCP / ableton-mcp-extended"
      url: "https://github.com/uisato/ableton-mcp-extended"
      relevance: "Original 52-tool MCP surface that hallucinote-mcp greenfields away from (Wave M)"
      relationship: reference
    - name: "Cordyceps (Claude ↔ Grasshopper)"
      relevance: "Action-dispatch + discovery-layered tool design refined through real bugs; copied near-verbatim in docs/mcp-tool-design.md §2"
      relationship: reference
    - name: "MCP tool-count research (Anthropic, Speakeasy, Copilot)"
      relevance: "Empirical sweet spots: effectiveness degrades past ~25 tools, collapses past ~50. Drove the 52→10 consolidation decision (docs/mcp-tool-design.md §1.2)"
      relationship: reference

# =============================================================================
# PRODUCT DEFINITION
# =============================================================================
# Populated during discovery and definition.

product_definition:
  # One-sentence description of what this product is and why it exists.
  vision: "LLM-native music composition and production environment where the DB is the source of truth and Ableton Live is the rendering engine."

  # Measurable success criteria. What does "this worked" look like?
  goals:
    - "Move composers up the ladder of abstraction: an LLM can take a musical idea (e.g. 'bassline weaving between two drum parts at 95 and 100 BPM') and build it end-to-end against the DB"
    - "Songs are forkable: branch a chorus variant, A/B against main, throw it away — diffable and reviewable like code"
    - "Bulk operations become one-liners: humanize backbeats, sidechain pad notes, transpose tagged notes — accessible without scripting career"
    - "Songs are testable: structural assertions (bass-kick alignment, pan completeness, master-limiter presence) ride with the song"

  # Who uses this product and what they need.
  users:
    # Each persona:
    #   name: string
    #   description: string
    #   technical_level: none | basic | intermediate | advanced
    #   primary_needs: [string]
    #   constraints: [string]
    personas:
      - name: "LLM-collaborating composer"
        description: "The human author working through an LLM agent (Claude Code) to compose, arrange, and produce songs. Technical depth varies; the LLM mediates the structured access."
        technical_level: intermediate
        primary_needs:
          - "Structured access to every musical surface (notes, automation, devices, arrangement)"
          - "Reliable bidirectional sync with Ableton — edits in the DAW round-trip back without loss"
          - "Bulk operations the LLM can express as one-liners"
        constraints:
          - "Single-user authoring; no multi-user concurrency"
          - "Local deployment; no cloud dependency"
      - name: "The LLM agent itself"
        description: "Claude Code (or equivalent MCP-capable agent) is a first-class consumer. The 10-tool surface and discovery primitives (resources, prompts) are designed for its context-cost economics."
        technical_level: advanced
        primary_needs:
          - "Low-context-cost tool surface (~10 unified tools, not 52 narrow ones)"
          - "Self-service discovery (resources for static reads, prompts for multi-step recipes)"
          - "Error responses that teach (canonical-form hints when actions fail)"
        constraints:
          - "Tool-count research caps effective surface around 25; 52 collapsed empirically"

  # Core user flows (UI), operations (API), or pipeline stages (automation).
  # Each: { name, description, steps (optional), priority (must-have/nice-to-have) }
  core_flows:
    - name: "Compose via generators → mutators → DB"
      description: "Pure generators produce note arrays with semantic tags; song build.py persists them via mutators; events emit alongside."
      priority: must-have
    - name: "Push DB → Ableton"
      description: "plan_push_* emits a PushPlan of canonical MCP calls; agent executes; apply_push_results writes the projection (ableton_sessions + ableton_links)."
      priority: must-have
    - name: "Pull Ableton → DB"
      description: "PullPlan probes the live surface; the /ableton-pull skill normalizes responses; apply_pull_results diffs and mutates (Ableton-authoritative under V1)."
      priority: must-have
    - name: "Capture initial snapshot"
      description: "hallucinote.capture takes a one-shot snapshot of a live Ableton session to seed the DB's mix half on song creation."
      priority: must-have
    - name: "Build the example song"
      description: "`python songs/falling-walking/build.py --reset` is the end-to-end smoke + canary for the whole stack."
      priority: must-have

  # Scope decisions.
  scope:
    v1:
      # `scope.v1` is the intent for the v1.0 release surface — it lists
      # what's IN scope, regardless of shipped status. For current ship
      # status see `git log` + `.prawduct/.test-evidence.json` + the
      # build-plan in `.prawduct/artifacts/build-plan.md`.
      - "DB schema + mutator API + queries (TEXT UUID identity; paired state-change + event-emit)"
      - "Push planners: clip, score, mix, devices, automation, arrangement, cue points"
      - "Pull planners: mix-state (W3-1), cue points + score globals (W3-2), device chains (W3-3 / M+1-2), arrangement-clip placements (W3-4 / M+1-3b), and — added during V1 close-out scoping 2026-05-17 — session-view clip slots"
      - "Note pull via stable-ID read + whole-clip write (gap #4 partial resolution — added during V1 close-out scoping 2026-05-17). Read uses Live's `clip.get_notes_extended()`; per-note diff happens DB-side; push reuses `ableton_clip(action='replace_notes')`. Playback-continuity caveat (Live may retrigger a clip on mid-playback `set_notes`) is acceptable because live performance is in `scope.never`. (Not yet shipped — Chunk D of the close-out plan.)"
      - "hallucinote-mcp v1.0: 10 unified action-dispatch tools (ableton_session/track/return/clip/note/device/automation/arrangement/scene/browser) + resources + prompts + install skill. `ableton_help` stays folded into prompts + resources (V1 close-out decision 2026-05-17 — not a separate 11th tool)."
      - "falling-walking as the canary song — its build + snapshot tests gate every push planner / mutator change (see `.prawduct/.test-evidence.json` for current suite count)"
    accommodate:
      - "Multi-song workspace: cross-song shared kits, groove templates, instrument presets (project memory: cross-song reuse)"
      - "Event-store flip: schema and mutator discipline already seed it"
      - "App-layer multi-user concurrency: per project memory `feedback_app_layer_concurrency`, when multi-user lands it solves at the DB / event-store layer, not at the MCP wire shape. No per-element MCP locking, no per-element write surfaces solely for multi-party concerns."
    later:
      - "Envelope pull (blocked on `hallucinote-mcp` envelope read surface — backlog)"
      - "Nested rack chain probe + push (blocked on `hallucinote-mcp` `get_device_chains` — backlog)"
      - "Tempo / signature automation at (bar, beat) (blocked on Live arrangement-envelope target_kind — backlog)"
      - "Device-parameter pull (sync-layer not yet built — backlog. `ableton_device(action='get_parameters')` is fine in the greenfield server; the legacy fork's #17b bug doesn't apply)"
      - "Performance / expression realization layer — microtiming + dynamics + articulation as an authored PROFILE -> structured (1/f-correlated, NOT white-noise) realization that READS energy/harmony (a 'realization layer', not a peer axis; the KTH metaperformer profile/realization pattern). Supersedes the earlier 'quantize/swing/groove module' framing. METERED-ONLY by design: unmetered / free-time performance (Gregorian chant, free rubato, rap-flow) is OUT OF SCOPE — a documented limitation, NOT a flaw — and is future research. See arrangement-model.md 'The dimension taxonomy' (incl. the SCOPE BOUNDARY) + backlog ARR-8P5K / ARR-2B6K."
      - "Audio render + analysis (ableton_render + ableton_analysis)"
      - "Event replay function (replay(events) → state) + cross-DB merge tooling — useful after event-store flip"
      - "Track routing: sidechain, parallel busses, input/output routing config"
      - "Group tracks (tracks.parent_track_id + Live group semantics)"
      - "Audio clips: clip kind discriminator, file references, warp metadata"
    never:
      - item: "A general DAW competing with Ableton"
        rationale: "Ableton is the rendering engine; Hallucinote leans on it, doesn't replace it"
      - item: "A non-LLM authoring tool"
        rationale: "Every design choice favors the LLM workflow; humans can write Python against the library but they're not the target"
      - item: "A live performance system"
        rationale: "Composition + production tool only; performance happens downstream in Ableton"
      - item: "A walled garden / proprietary formats"
        rationale: "SQLite + Python + git + standard MCP. If Hallucinote dies, songs are still composable from the repo"

  # Product identity.
  product_identity:
    name: "Hallucinote"
    personality: null     # Brand personality, mood (null for internal tools)
    visual_preferences: null  # Look/feel preferences (null for non-visual products)

  platform: "CLI + local MCP server (Python; SQLite; Ableton Live Remote Script on macOS today)"

  # Non-functional requirements, calibrated to risk.
  nonfunctional:
    performance: "Test suite under ~10s serial / faster parallel (pytest-xdist with directory-grouped distribution); current counts + timings live in `.prawduct/.test-evidence.json`. Push/pull latency bounded by MCP round-trips, not Hallucinote's planner cost."
    scalability: "Not applicable — single-user authoring. Songs are independent; no shared-state concerns."
    uptime: "Not applicable — no always-on component."
    cost_constraints: "Zero monthly cost target — local-only deployment, no cloud services, no paid APIs."

  regulatory: []          # Each: { regulation, applicability, impact }
  cost_estimates: []      # Each: { item, estimated_monthly_cost, notes }

# =============================================================================
# TECHNICAL DECISIONS
# =============================================================================
# Every entry includes rationale.
# Each: { decision, rationale, alternatives_considered, date }

technical_decisions:
  architecture:
    - decision: "DB-as-source-of-truth with append-only event log; mutator-only writes"
      rationale: "Every state change pairs with an event row in the same transaction. The event log seeds a future event-store flip without requiring a rewrite — the schema is the *materialized state* of a stream we'll replay later (project memory: architecture_db)."
      alternatives_considered: "DAW-project-as-source-of-truth (the AbletonMCP fork's implicit model); pure event store from day one (premature for current single-user scale)."
      date: "2026-05-15 (chunks 1-5 migration)"
    - decision: "Plan-based sync (not side-effect sync)"
      rationale: "sync.push returns PushPlan / ToolCall objects; the agent executes the plan and feeds results back via apply_push_results. Keeps the sync layer testable without Live running and reorder-safe across MCP retries."
      alternatives_considered: "Direct MCP invocation from sync — would couple tests to a live MCP server; rejected as a long-term posture."
      date: "2026-05-15 (chunks 1-5)"
    - decision: "10 unified MCP tools with action dispatch (greenfield as `hallucinote-mcp`)"
      rationale: "Tool-count research caps effective LLM tool selection around 25; AbletonMCP's 52-tool surface measurably degraded the model. Consolidating into ableton_session/track/return/clip/note/device/automation/arrangement/scene/browser keeps capability while cutting the selection space."
      alternatives_considered: "Continue extending AbletonMCP narrow-setter-by-narrow-setter; rejected because each new capability would add to the 52-tool problem rather than solving it."
      date: "2026-05-16 (Wave M design merged; v1.0 surface closed at M-7)"
    - decision: "Bidirectional sync with Ableton-authoritative conflict policy (V1)"
      rationale: "PullPlan + apply_pull_results path is Ableton-authoritative under the V1 conflict policy; field-level diffs tolerate _FLOAT_EPS jitter so display rounding doesn't churn events. Three-way merge deferred until cross-collaborator merges become real."
      alternatives_considered: "DB-authoritative (rejected — punishes manual edits in Ableton); three-way merge (deferred — premature without multi-collaborator workflows)."
      date: "2026-05-16 (Wave 3 pull-side sync)"
    - decision: "W11-A `hallucinote://` resources: shared `hallucinote-core` package, slug-in-URI addressing, LOM-mirrored hierarchy, always-requery (no caching)"
      rationale: "Four interlocking choices, each made under the 'do things right' mantra. (a) **Shared core package**: extract the read API (queries + read-shaped types) from `hallucinote` into a new `hallucinote-core` that both `hallucinote` and `hallucinote-mcp` depend on, instead of having `hallucinote-mcp` import `hallucinote` directly (Option A) or duplicate read code (Option B). Pays the restructure cost once; keeps `hallucinote-mcp`'s dep surface honest; gives the read API a deliberate public-contract boundary. (b) **Slug in URI**: every `hallucinote://` URI carries the song slug explicitly (`hallucinote://song/<slug>/...`). cwd-based 'current song' resolution is unreliable — users start Claude Code in `/hallucinote` and switch between songs; the slug is also the on-disk subdirectory name and the convention for several file names, so authors already know it. (c) **Mirror Ableton's object model**: URI shape parallels the `ableton://` hierarchy as closely as the DB allows (`hallucinote://song/<slug>/track/N/clip/M/notes` mirrors `ableton://session/snapshot` and the per-action addressing the 10 unified tools use). Authors get one mental model, not two. (d) **Always requery**: handlers re-read SQLite on every resource request. Concurrent DB mutations during an agent session would invalidate any cache; optimize only if a measured perf finding demands it."
      alternatives_considered: "A: hallucinote_mcp imports hallucinote directly — apparent independence but tight coupling and an undisciplined contract surface; rejected. B: hallucinote_mcp owns a parallel reader against the SQLite file — duplicates queries.py with drift risk; rejected. D: defer; ship Python helper script — doesn't solve W11-A's context-cost problem. cwd-based song resolution — rejected because users run Claude Code from /hallucinote and work on multiple songs in one session. Per-resource caching — rejected (always-requery; defer optimization until measured)."
      date: "2026-05-20 (W11-A scoping, post-v1 cumulative merge to main)"

  technology:
    - decision: "Python 3.10+ stdlib-only runtime for the hallucinote library"
      rationale: "Reduces dependency surface; library is the durable component (songs depend on it). Python 3.10+ for PEP 604 unions and modern typing."
      alternatives_considered: "Rust core for performance — premature; SQLite WAL is already faster than any musical I/O bottleneck."
      date: "2026-05-15"
    - decision: "`mcp>=1.0` for the hallucinote-mcp server"
      rationale: "Standard MCP transport; hallucinote_mcp/pyproject.toml declares it as the only runtime dep."
      alternatives_considered: "Custom JSON-RPC — would diverge from the agent ecosystem."
      date: "2026-05-16"
    - decision: "SQLite WAL with `timeout=10.0`"
      rationale: "Single-user, local. WAL gives readers + writers without blocking; the 10s timeout absorbs any short contention from concurrent build/test runs."
      alternatives_considered: "Postgres (overkill for single-user); DuckDB (analytical-first, weaker write story)."
      date: "2026-05-15"
    - decision: "pytest + hypothesis (enabled Wave M-4) for tests; pytest-xdist for parallelism"
      rationale: "pytest is the de facto Python standard. Hypothesis was enabled in Wave M-4 for the first invariant-rich surface (envelope breakpoints); `tests/conftest.py` registers `dev` (max_examples=20) and `ci` (max_examples=200) profiles. Property tests live at `tests/unit/generators/test_bar_beats_properties.py` and `hallucinote_mcp/tests/unit/test_envelope_properties.py`. xdist with directory-grouped distribution preserves fixture isolation."
      alternatives_considered: "unittest (too verbose for fixture-heavy code)."
      date: "2026-05-15 (pytest), Wave M-4 (hypothesis enabled), J-2 (xdist installed)"

  data_model:
    - decision: "TEXT UUID primary keys (generated via `uuid.uuid4().hex`)"
      rationale: "Aligns with future cross-DB merge stories — UUIDs don't collide across forks. Generated in Python (`_uuid()` helper) so mutators don't depend on DB autoincrement."
      alternatives_considered: "INTEGER PRIMARY KEY (rejected — would collide across cross-collaborator merges)."
      date: "2026-05-15 (chunk 1)"
    - decision: "Paired state-change + event-emit in the same transaction"
      rationale: "Every mutator calls `_emit` exactly once in the same DB transaction as its state write. The event row carries `actor`, `reason`, `request_id`, `seq` (monotonic). This is the load-bearing invariant for a future event-store flip."
      alternatives_considered: "Logging-style events outside the transaction (rejected — opens drift between state and audit log)."
      date: "2026-05-15"
    - decision: "ableton_sessions + ableton_links projection separation"
      rationale: "Bindings to Ableton don't live on core rows. Multiple sessions per song are intentional — one song can be bound to several Live sets without aliasing. `link_db_to_ableton(session_id, db_kind, db_id, ableton_index)` is the generic mutator that replaced three per-domain link_*_to_ableton functions."
      alternatives_considered: "Per-domain ableton_index columns on every entity row (rejected — coupled core schema to the rendering layer)."
      date: "2026-05-15 (chunk 1)"

  integrations:
    - decision: "Greenfield `hallucinote-mcp` v1.0 as the MCP layer (in-repo, replacing AbletonMCP fork)"
      rationale: "The AbletonMCP / ableton-mcp-extended fork drove the original design but its 52-tool surface hit the model-effectiveness ceiling. Wave M migrated to a greenfield 10-tool surface with action dispatch + resources + prompts; the fork is no longer a runtime dependency."
      alternatives_considered: "Continue patching the fork; rejected for the same reason the consolidation happened."
      date: "2026-05-16 (Wave M close)"
    - decision: "Ableton Remote Script for in-Live integration"
      rationale: "Live's embedded Python is the only path to live session control. The Remote Script runs inside Live, the hallucinote-mcp server runs outside, UDP carries the wire protocol."
      alternatives_considered: "Max for Live (heavier; not all users have it); OSC-only (lower-level than needed)."
      date: "2026-05-16"

  operational: []

# =============================================================================
# DESIGN DECISIONS
# =============================================================================
# UX, IA, and design decisions. Some fields (like error_handling_approach) apply
# to all products; others (like visual_direction) only apply to products with a UI.
# Each: { decision, rationale, date }

design_decisions:
  information_architecture:
    - decision: "Layered folders inside src/hallucinote/: db/ (state+events+mutators+queries), generators/ (pure musical primitives), sync/ (DB↔Ableton bridge), capture.py (snapshot)"
      rationale: "Each layer has a clean dependency direction: generators have no DB or MCP coupling; sync produces plans, not side effects; mutators are the only sanctioned writers."
      date: "2026-05-15"
    - decision: "Songs as self-contained units under songs/<slug>/"
      rationale: "A song = build.py + captured_session.json + tests/ + per-song SQLite DB (gitignored). Tests live next to the song so the directory is forkable as a unit."
      date: "2026-05-17 (J-2b)"
  interaction_patterns: []
  accessibility_approach: null
  error_handling_approach: "Plain exceptions (ValueError, KeyError); no custom hierarchy. Broad catches require `# prawduct:ok-broad-except` annotation with rationale. Never silently swallow exceptions — every catch logs context."
  observability_approach: "The event log IS the audit trail. Every mutator emits an event with actor (in events.ACTORS), reason, request_id, and monotonic seq. No logging frameworks beyond stdlib `logging`. The `requests` table groups events under higher-level intent for cross-mutator correlation."
  infrastructure_dependencies: "SQLite (embedded, WAL mode) for state. Ableton Live + hallucinote-mcp Remote Script for the rendering engine. No external services. Live-Ableton tests are manual; CI runs against mocked dispatcher tests in hallucinote_mcp/tests/."
  visual_direction: null


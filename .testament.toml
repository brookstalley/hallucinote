# testament (https://github.com/brookstalley/testament) — runs this repo's test
# suite on a pool of container runners. `testament guide project` explains each key.
manifest_version = 2
name = "hallucinote"
executor = "container"
# The same invocation CI runs (.github/workflows/ci.yml): the FULL suite.
# testpaths in pyproject.toml covers tests/, hallucinote_mcp/tests/ and examples/.
command = ["uv", "run", "--no-sync", "python", "-m", "pytest"]
default_selection = ["tests", "hallucinote_mcp/tests", "examples"]
env_inputs = ["uv.lock"]  # a change to it means a new env
env = { UV_CACHE_DIR = "/tr/cache/uv" }

[image]
dockerfile = ".devcontainer/Dockerfile"
inputs = [".devcontainer/Dockerfile"]  # it COPYs nothing from the repo

[setup]  # run when a workspace moves to a new tree; same sync as CI (--locked,
# so a stale uv.lock fails here as it does in CI rather than passing on the pool)
steps = [["uv", "sync", "--all-packages", "--all-extras", "--locked"]]

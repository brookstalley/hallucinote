<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Hero screenshot placeholder">
  <rect width="1200" height="480" rx="14" fill="#0f1117"/>
  <rect x="12" y="12" width="1176" height="456" rx="10" fill="none" stroke="#3a4256" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- left: prompt pane -->
  <rect x="44" y="56" width="520" height="368" rx="8" fill="#161a23" stroke="#2a3040" stroke-width="1.5"/>
  <text x="68" y="100" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8aa0c0">&gt; make a 2-minute punk song that crams</text>
  <text x="68" y="128" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8aa0c0">&nbsp;&nbsp;Beethoven's 5th into it. drums, bass,</text>
  <text x="68" y="156" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8aa0c0">&nbsp;&nbsp;lead, staccato-synth vocals. punk-fate.</text>
  <text x="68" y="212" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5f6b82">scaffold → compose → push (14 phases) →</text>
  <text x="68" y="236" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5f6b82">render → review</text>
  <!-- arrow -->
  <text x="592" y="246" font-family="ui-sans-serif, sans-serif" font-size="40" fill="#4a5470">→</text>
  <!-- right: Live set pane -->
  <rect x="636" y="56" width="520" height="368" rx="8" fill="#161a23" stroke="#2a3040" stroke-width="1.5"/>
  <rect x="660" y="84" width="110" height="316" rx="4" fill="#21304a"/>
  <rect x="784" y="84" width="110" height="316" rx="4" fill="#2a2440"/>
  <rect x="908" y="84" width="110" height="316" rx="4" fill="#1f3a32"/>
  <rect x="1032" y="84" width="100" height="316" rx="4" fill="#3a2a2a"/>
  <text x="896" y="450" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#5f6b82">Ableton Live — tracks, clips, mix</text>
  <!-- caption -->
  <text x="600" y="34" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#6b7689">placeholder — replace with a real screen capture before release</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="A plain-language prompt in Claude Code, and the Ableton Live set Hallucinote builds from it">
  <rect width="1200" height="480" rx="14" fill="#0f1117"/>

  <!-- left: Claude Code prompt pane -->
  <rect x="40" y="44" width="530" height="392" rx="10" fill="#141821" stroke="#2a3040" stroke-width="1.5"/>
  <circle cx="66" cy="70" r="6" fill="#ff5f57"/>
  <circle cx="88" cy="70" r="6" fill="#febc2e"/>
  <circle cx="110" cy="70" r="6" fill="#28c840"/>
  <text x="300" y="75" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5f6b82">claude — songs workspace</text>

  <text x="66" y="122" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5">&gt; make a 2-minute punk song that crams</text>
  <text x="66" y="148" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5">&#160;&#160;the chords of Beethoven's 5th into it.</text>
  <text x="66" y="174" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5">&#160;&#160;drums, bass, lead, staccato-synth vox.</text>
  <text x="66" y="200" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e8edf5">&#160;&#160;call it punk-fate.</text>

  <text x="66" y="252" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7d8aa3">⏺ scaffolding songs/punk-fate/</text>
  <text x="66" y="278" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7d8aa3">⏺ writing build.py — 4 parts, 62 bars</text>
  <text x="66" y="304" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7d8aa3">⏺ picking instrument chains</text>
  <text x="66" y="330" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8fd18c">⏺ pushing into Ableton Live…</text>

  <rect x="66" y="356" width="438" height="10" rx="5" fill="#1d2331"/>
  <rect x="66" y="356" width="316" height="10" rx="5" fill="#3d6df0"/>
  <text x="66" y="396" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5f6b82">phase 10/14 · device-sidechain</text>

  <!-- arrow -->
  <path d="M 588 240 L 622 240 M 612 230 L 624 240 L 612 250" stroke="#4a5470" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: Live set pane -->
  <rect x="640" y="44" width="520" height="392" rx="10" fill="#141821" stroke="#2a3040" stroke-width="1.5"/>

  <!-- track headers -->
  <rect x="662" y="66" width="112" height="26" rx="4" fill="#21304a"/>
  <text x="718" y="84" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#aebfd8">Drums</text>
  <rect x="782" y="66" width="112" height="26" rx="4" fill="#2a2440"/>
  <text x="838" y="84" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#bcaed8">Bass</text>
  <rect x="902" y="66" width="112" height="26" rx="4" fill="#1f3a32"/>
  <text x="958" y="84" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#a3cfc0">Lead</text>
  <rect x="1022" y="66" width="112" height="26" rx="4" fill="#3a2a2a"/>
  <text x="1078" y="84" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#d6b3ad">Vox</text>

  <!-- clip grid: 4 tracks x 5 scene rows -->
  <g>
    <rect x="662" y="100" width="112" height="38" rx="3" fill="#2e4468"/>
    <rect x="782" y="100" width="112" height="38" rx="3" fill="#3b3358"/>
    <rect x="902" y="100" width="112" height="38" rx="3" fill="#193028"/>
    <rect x="1022" y="100" width="112" height="38" rx="3" fill="#513c3a"/>

    <rect x="662" y="144" width="112" height="38" rx="3" fill="#2e4468"/>
    <rect x="782" y="144" width="112" height="38" rx="3" fill="#3b3358"/>
    <rect x="902" y="144" width="112" height="38" rx="3" fill="#2b4d40"/>
    <rect x="1022" y="144" width="112" height="38" rx="3" fill="#513c3a"/>

    <rect x="662" y="188" width="112" height="38" rx="3" fill="#3a557f"/>
    <rect x="782" y="188" width="112" height="38" rx="3" fill="#4a4070"/>
    <rect x="902" y="188" width="112" height="38" rx="3" fill="#2b4d40"/>
    <rect x="1022" y="188" width="112" height="38" rx="3" fill="#664a47"/>

    <rect x="662" y="232" width="112" height="38" rx="3" fill="#2e4468"/>
    <rect x="782" y="232" width="112" height="38" rx="3" fill="#3b3358"/>
    <rect x="902" y="232" width="112" height="38" rx="3" fill="#193028"/>
    <rect x="1022" y="232" width="112" height="38" rx="3" fill="#513c3a"/>

    <rect x="662" y="276" width="112" height="38" rx="3" fill="#1a2029"/>
    <rect x="782" y="276" width="112" height="38" rx="3" fill="#4a4070"/>
    <rect x="902" y="276" width="112" height="38" rx="3" fill="#2b4d40"/>
    <rect x="1022" y="276" width="112" height="38" rx="3" fill="#1a2029"/>
  </g>

  <!-- device chain strip -->
  <rect x="662" y="326" width="472" height="42" rx="4" fill="#10141c" stroke="#242b3a" stroke-width="1"/>
  <rect x="672" y="334" width="96" height="26" rx="3" fill="#1d2634"/>
  <text x="720" y="352" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#7d8aa3">Drum Rack</text>
  <rect x="776" y="334" width="96" height="26" rx="3" fill="#1d2634"/>
  <text x="824" y="352" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#7d8aa3">Saturator</text>
  <rect x="880" y="334" width="96" height="26" rx="3" fill="#1d2634"/>
  <text x="928" y="352" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#7d8aa3">Glue Comp</text>
  <rect x="984" y="334" width="96" height="26" rx="3" fill="#1d2634"/>
  <text x="1032" y="352" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#7d8aa3">Reverb send</text>

  <!-- mixer faders -->
  <g stroke="#2f3a4e" stroke-width="3" stroke-linecap="round">
    <line x1="718" y1="386" x2="718" y2="420"/>
    <line x1="838" y1="386" x2="838" y2="420"/>
    <line x1="958" y1="386" x2="958" y2="420"/>
    <line x1="1078" y1="386" x2="1078" y2="420"/>
  </g>
  <g fill="#8aa0c0">
    <rect x="708" y="392" width="20" height="7" rx="2"/>
    <rect x="828" y="402" width="20" height="7" rx="2"/>
    <rect x="948" y="396" width="20" height="7" rx="2"/>
    <rect x="1068" y="406" width="20" height="7" rx="2"/>
  </g>

  <text x="900" y="452" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#5f6b82">Ableton Live — tracks, clips, device chains, mix</text>
</svg>

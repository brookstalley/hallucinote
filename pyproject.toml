[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinote"
version = "0.9.0"
description = "DB-backed MIDI authoring with Ableton sync via MCP"
requires-python = ">=3.10"
dependencies = [
    # Audio-analysis foundation (Chunk 1 of the audio-analysis MVP). numpy +
    # scipy underpin every analysis to come (FFT, cross-correlation, true-peak
    # oversample); soundfile is the canonical WAV IO (scipy.io.wavfile is
    # broken on float32 edges per the spike's library notes). Heavier audio
    # libs (pyloudnorm, librosa, pyroomacoustics) land with Chunk 3.
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "hallucinote_mcp/tests", "songs"]
python_files = ["test_*.py"]
# `testpaths = ["songs"]` makes pytest discover any `songs/<slug>/tests/test_*.py`
# automatically — per-song test suites live alongside their `build.py` so the
# song stays a self-contained unit (per docs/VISION.md "songs as git repos").
# Song test dirs intentionally have NO `__init__.py` (rootdir-discovered),
# which keeps them from colliding with the platform `tests/` package
# namespace under pytest's default `prepend` import mode.
#
# Per-song convention: test filenames MUST be unique across all songs
# (`test_<slug>_build.py`, not bare `test_build.py`). Under the rootdir-
# discovered + prepend-import-mode combination above, basename uniqueness is
# how pytest distinguishes them; same-basename collisions across songs cause
# collection errors. Follow falling-walking's pattern: descriptive per-song
# names (`test_capture_replay.py`, `test_push_mix_snapshot.py`).

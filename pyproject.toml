[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinote"
version = "0.9.0"
description = "DB-backed MIDI authoring with Ableton sync via MCP"
requires-python = ">=3.10"
dependencies = [
    # Audio-analysis foundation. numpy + scipy underpin every analysis (FFT,
    # cross-correlation, true-peak oversample); soundfile is the canonical
    # WAV IO (scipy.io.wavfile is broken on float32 edges per the spike's
    # library notes). pyloudnorm = BS.1770-4 integrated/short-term loudness.
    # librosa = STFT for per-band energy attribution. pyroomacoustics gives us
    # exactly one function from .experimental.rt60 — measure_rt60 — for
    # reverb-send verification. All MIT/BSD/ISC.
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.2",
    "librosa>=0.10",
    "pyroomacoustics>=0.7",
    # `hallucinote.workspace` parses the `hallucinote.toml` project-root marker.
    # tomllib is stdlib on 3.11+; tomli backfills it on 3.10 (requires-python
    # floor). The marker reader degrades gracefully if neither is present.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.0",
]
# A song repo whose build.py pushes to Live needs the MCP client transport the
# engine imports lazily (sync/push_cli.py). It's an undeclared coupling in the
# monorepo (both packages coexist in the dev venv); declared here so a
# standalone song repo can `pip install hallucinote[live]` instead of hitting
# an ImportError at push time. See .prawduct/artifacts/project-root-contract.md.
live = [
    "hallucinote-mcp>=0.9",
]

# --- uv workspace (INS-7V2D) ---------------------------------------------------
# The plugin bundles BOTH the engine (this package) and the MCP server
# (hallucinote_mcp) and runs the server with uv from a committed uv.lock into a
# ${CLAUDE_PLUGIN_DATA} env (see .prawduct/artifacts/plans/INS-7V2D/design.md).
# Declaring the workspace lets `uv sync --all-packages` build ONE env containing
# the server (mcp) + the engine (for the lazy-imported analysis path) — without
# hallucinote_mcp hard-depending on hallucinote (the import-time isolation
# contract, memory project_mcp_server_stdlib_only, is preserved). The source
# mapping resolves the `[live]` extra's `hallucinote-mcp` to the workspace member
# instead of PyPI (where it isn't published), so `uv lock` succeeds. pip ignores
# [tool.uv], so the editable dev install + song-side `pip install hallucinote[live]`
# are unchanged.
[tool.uv.workspace]
members = ["hallucinote_mcp"]

[tool.uv.sources]
hallucinote-mcp = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

# /song-new (hallucinote.tools.scaffold_song) renders these at runtime via
# rglob, so they must ship with the wheel. Editable installs already see the
# real source tree; this covers pip/uvx wheel installs. `.gitkeep` preserves
# the empty decisions/ + annotations/ dirs the scaffold reproduces.
[tool.setuptools.package-data]
"hallucinote.tools" = ["templates/**/*", "templates/**/.gitkeep"]

[tool.pytest.ini_options]
# Songs now live in their own repo (hallucinote-songs) with their own pytest
# config — the framework tests the ENGINE + MCP server only.
testpaths = ["tests", "hallucinote_mcp/tests"]
python_files = ["test_*.py"]
markers = [
    "audio: exercises the native audio/DSP stack (librosa/numba/scipy). The root conftest auto-applies this by path; set HALLUCINOTE_SKIP_AUDIO=1 to skip in CPU-only/container sessions where that stack is unstable.",
    "ableton: requires a live Ableton/sequencer connection. Opt-in (default-skip); set HALLUCINOTE_WITH_ABLETON=1 to run. Containers never have Ableton, so these never break a default run.",
]

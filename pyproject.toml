[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinote"
# CANONICAL VERSION — the single source of truth for the product version.
# Keep .claude-plugin/plugin.json and src/hallucinote/__init__.py in lockstep;
# tests/unit/test_version_parity.py FAILS if any drifts. (The MCP server's
# hallucinote_mcp.BASE_VERSION is a SEPARATE wire-protocol axis — see that file.)
version = "1.8.1"
description = "DB-backed MIDI authoring with Ableton sync via MCP"
requires-python = ">=3.10"
dependencies = [
    # Audio-analysis foundation. numpy + scipy underpin every analysis (FFT,
    # cross-correlation, true-peak oversample); soundfile is the canonical
    # WAV IO (scipy.io.wavfile is broken on float32 edges per the spike's
    # library notes). pyloudnorm = BS.1770-4 integrated/short-term loudness.
    # librosa = STFT for per-band energy attribution. pyroomacoustics gives us
    # exactly one function from .experimental.rt60 — measure_rt60 — for
    # reverb-send verification. All MIT/BSD/ISC.
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.2",
    "librosa>=0.10",
    "pyroomacoustics>=0.7",
    # `hallucinote.workspace` parses the `hallucinote.toml` project-root marker.
    # tomllib is stdlib on 3.11+; tomli backfills it on 3.10 (requires-python
    # floor). The marker reader degrades gracefully if neither is present.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
# The unified engine CLI — a thin dispatcher over the sync/tools modules
# (PLUGIN-SELF-CONTAINED). Registered in the plugin's uv env so the agent runs
# `uv run --project <plugin-root> --frozen hallucinote <cmd>` — no separate install.
hallucinote = "hallucinote.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.0",
    # Lint + type gates (INF-2C4X). CI runs `uv run ruff check .` and
    # `uv run mypy` from this env; config lives in [tool.ruff]/[tool.mypy] below.
    "ruff>=0.15",
    "mypy>=1.19",
]
# (The vestigial `[live]` extra was dropped 2026-07-02 with a uv.lock re-lock —
# the `[tool.uv.workspace]` below is what builds the one env with both packages.)

# --- uv workspace (INS-7V2D) ---------------------------------------------------
# The plugin bundles BOTH the engine (this package) and the MCP server
# (hallucinote_mcp) and runs the server with uv from a committed uv.lock into a
# ${CLAUDE_PLUGIN_DATA} env (see .prawduct/artifacts/plans/INS-7V2D/design.md).
# Declaring the workspace lets `uv sync --all-packages` build ONE env containing
# the server (mcp) + the engine (for the lazy-imported analysis path) — without
# hallucinote_mcp hard-depending on hallucinote (the import-time isolation
# contract, memory project_mcp_server_stdlib_only, is preserved). The source
# mapping resolves the `[live]` extra's `hallucinote-mcp` to the workspace member
# instead of PyPI (where it isn't published), so `uv lock` succeeds. pip ignores
# [tool.uv], so the editable dev install is unchanged. (PLUGIN-SELF-CONTAINED:
# there is no song-side `pip install` anymore — skills run the engine via the
# server's own interpreter from this one env; the `[live]` extra above is now
# vestigial. See technical_decisions: "Self-contained plugin".)
[tool.uv.workspace]
members = ["hallucinote_mcp"]

[tool.uv.sources]
hallucinote-mcp = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

# /song-new (hallucinote.tools.scaffold_song) renders these at runtime via
# rglob, so they must ship with the wheel. Editable installs already see the
# real source tree; this covers pip/uvx wheel installs. `.gitkeep` preserves
# the empty decisions/ + annotations/ dirs the scaffold reproduces.
[tool.setuptools.package-data]
"hallucinote.tools" = ["templates/**/*", "templates/**/.gitkeep"]

# --- lint (INF-2C4X) ------------------------------------------------------------
# Pragmatic, high-signal ruleset: pyflakes (F) + the pycodestyle error classes
# that catch real bugs (imports, statements, runtime errors), plus W and PLE
# (Pylint errors), which the codebase is already clean on. Deliberately NOT
# enforced: line length / formatting (no reformat crusade — existing code has
# long doc-bearing lines) and import sorting.
[tool.ruff]
# Whole-repo lint (tests, tools, hooks, research drivers included) — same
# breadth as `ruff check .` in CI.
src = ["src", "hallucinote_mcp/src"]

[tool.ruff.lint]
select = [
    "E4",  # imports
    "E7",  # statements (comparison, semicolons, ambiguous names, lambda-assign)
    "E9",  # runtime errors (syntax/io)
    "F",   # pyflakes (unused/undefined names, f-strings, redefinitions)
    "W",   # pycodestyle warnings (already clean)
    "PLE", # pylint errors (already clean)
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files are deliberate re-export surfaces (e.g.
# db/mutations/__init__.py re-exposes the pre-split module's private helpers —
# tests consume `M._delete_track` etc.). Unused-import there is the point.
"**/__init__.py" = ["F401"]
# build.py's tombstone path resolves per-kind delete mutators via
# `globals()[verb]` (see its import-block comment) — every delete mutator must
# be imported into the module namespace even though nothing references it
# statically.
"src/hallucinote/db/mutations/build.py" = ["F401"]
# Deliberate mid-file import block — the file is organized in two banner-
# separated halves (pure parsing vs M.create_device DB integration), each
# with its own imports.
"tests/unit/test_preset_query.py" = ["E402"]

# --- types (INF-2C4X) -----------------------------------------------------------
# Checks the two shipped packages (engine + MCP server). Source code only —
# tests exercise contracts at runtime; typing them is not the gate. The config
# is default-strictness mypy (annotated code IS checked; a regression in any
# annotated signature fails CI) with scoped, commented relaxations below for
# the known Optional-narrowing debt clusters. CI runs `uv run mypy` (files come
# from this section).
[tool.mypy]
files = ["src/hallucinote", "hallucinote_mcp/src/hallucinote_mcp"]
# Mirror the pytest pythonpath trick: force THIS checkout's sources so a git
# worktree checks the local tree, not the editable-install .pth target.
mypy_path = "src:hallucinote_mcp/src"
explicit_package_bases = true
# Floor of requires-python — flags 3.11+-only stdlib/syntax use.
python_version = "3.10"

# Stub-less third-party imports, ignored BY NAME — deliberately NOT a global
# ignore_missing_imports, which would silently type any future unresolved
# import as Any. Adding a dependency without stubs => list it here, on purpose.
# (numpy, librosa, and mcp ship py.typed and are NOT listed — they resolve.)
[[tool.mypy.overrides]]
module = [
    "pyloudnorm.*",      # no py.typed / stubs package
    "pyroomacoustics.*", # no py.typed (used only for .experimental.rt60)
    "scipy.*",           # scipy ships no complete stubs; scipy-stubs not a dep
    "soundfile",         # no py.typed
    "tomli",             # 3.10-only backfill; absent from the 3.11+ env mypy runs in
]
ignore_missing_imports = true

# Optional-narrowing debt clusters: modules whose guards (validated wire
# params, is-finite checks, correlated locals) are invisible to mypy, where a
# per-line cleanup is disproportionate to this adoption pass. Only the listed
# error codes are disabled, per module — everything else in these files is
# still checked. Candidates for a follow-up annotation-tightening item.
[[tool.mypy.overrides]]
# Assembles PartPerformance kwargs via **dict[str, object] merge.
module = "hallucinote.performance.lens"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
# Live-pulled rows are Optional-typed but validated upstream of use.
module = "hallucinote.capture"
disable_error_code = ["arg-type", "index"]

[[tool.mypy.overrides]]
# `ref` and return-name lookups are narrowed by runtime shape checks.
module = "hallucinote.sync.pull.mix"
disable_error_code = ["arg-type", "str-unpack"]

[[tool.mypy.overrides]]
# Link-row dicts and analyzer-surface maps are shape-checked at runtime.
module = "hallucinote.sync.push.probe"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
# Envelope route targets are validated before resolution.
module = "hallucinote.sync.push.envelopes"
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
# Wire params + LOM objects: validated dynamically; lambdas capture LOM
# attrs mypy can't infer ([misc] "Cannot infer type of lambda").
module = "hallucinote_mcp.handlers.automation"
disable_error_code = ["arg-type", "misc"]

[[tool.mypy.overrides]]
# min/max/compare chains over Optional floats guarded by earlier branches.
module = "hallucinote_mcp.handlers.display_value"
disable_error_code = ["operator", "type-var"]

[[tool.mypy.overrides]]
# Browser-path / rack-chain params are validated by the handlers' own
# teaching errors before use.
module = "hallucinote_mcp.handlers.device"
disable_error_code = ["arg-type", "assignment", "union-attr"]

[tool.pytest.ini_options]
# Songs now live in their own repo (hallucinote-songs) with their own pytest
# config — the framework tests the ENGINE + MCP server only. The one exception
# is `examples/`, the in-repo demo workspace. Its first song was retired (its
# real output was the framework defects found by rebuilding it from scratch);
# the workspace stays in testpaths so the next demo song's tests join the
# default run the moment it lands — a demo song is documentation that has to
# keep working, and "builds headless with no Live present" is only backed by a
# suite that actually executes it.
# Front-insert THIS checkout's source dirs (relative to rootdir) so a bare
# `pytest` always tests the local tree — critical in a git worktree, where the
# editable-install `.pth` files resolve `hallucinote`/`hallucinote_mcp` to the
# PRIMARY checkout. Without this, a worktree `pytest` (and every prawduct hook
# that shells `python -m pytest`) silently imports primary-dir code and reports
# green against the wrong tree. In the primary dir these are the same paths the
# `.pth` already targets, so it's a no-op there.
pythonpath = ["src", "hallucinote_mcp/src"]
testpaths = ["tests", "hallucinote_mcp/tests", "examples"]
python_files = ["test_*.py"]
markers = [
    "audio: exercises the native audio/DSP stack (librosa/numba/scipy). The root conftest auto-applies this by path; set HALLUCINOTE_SKIP_AUDIO=1 to skip in CPU-only/container sessions where that stack is unstable.",
    "ableton: requires a live Ableton/sequencer connection. Opt-in (default-skip); set HALLUCINOTE_WITH_ABLETON=1 to run. Containers never have Ableton, so these never break a default run.",
]
